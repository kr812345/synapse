[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:datetime.*
    ignore:.*datetime\.utcnow.*:DeprecationWarning
    ignore::pytest.PytestCollectionWarning

markers =
    tier1: Tier 1 Feature Coverage E2E Tests
    tier2: Tier 2 Boundary & Corner Case E2E Tests
    tier3: Tier 3 Cross-Feature Combination E2E Tests
    tier4: Tier 4 Real-World Application Workflow E2E Tests
    tier5: Tier 5 Adversarial Stress & Hardening E2E Tests
    e2e: End-to-End Tests across all tiers
